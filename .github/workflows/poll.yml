name: Poll Garmin and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  poll-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poller deps
        run: pip install -r poller/requirements.txt

      - name: Poll Garmin Connect
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          python poller/garmin_poll.py \
            --out "docs/feed/${{ secrets.FEED_TOKEN }}/latest.json"

      - name: Wire feed URL into the app
        # FEED_TOKEN must be [A-Za-z0-9]+ (e.g. `openssl rand -hex 24`)
        run: |
          grep -q '__FEED_TOKEN__' docs/app.js
          sed -i "s/__FEED_TOKEN__/${{ secrets.FEED_TOKEN }}/g" docs/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
